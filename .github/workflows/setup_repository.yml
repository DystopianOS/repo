name: "Setup Database Repository"

on:
  workflow_call:
    inputs:
      trigger:
        description: "Trigger for rebuilding the repository database (e.g., 'init', 'add', 'update', 'delete')"
        required: true
        type: string
      aur_db_repository:
        description: "Full repository name (owner/repo) of the AUR database repository to update"
        required: false
        default: "DystopianOS/repo"
        type: string
  workflow_dispatch:
    inputs:
      trigger:
        description: "Trigger for rebuilding the repository database (e.g., 'init', 'add', 'update', 'delete')"
        required: true
        default: 'manual'
        type: string
      aur_db_repository:
        description: "Full repository name (owner/repo) of the AUR database repository to update"
        required: false
        default: "DystopianOS/repo"
        type: string


jobs:
  build-keyring:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: "build-keyring"
      cancel-in-progress: true
    outputs:
      gpg_key_id: ${{ steps.gpg_import.outputs.fingerprint }}
    steps:
      - id: validate_secrets
        run: |
          if [[ -z "${{ secrets.GPG_PACKAGER_PRIVATE_KEY || secrets.GPG_PRIVATE_KEY }}" ]]; then
            echo "GPG_PACKAGER_PRIVATE_KEY secret is not set. Please add it to the repository secrets."
            exit 1
          fi
          if [[ -z "${{ secrets.GPG_PACKAGER_PASSPHRASE || secrets.GPG_PASSPHRASE }}" ]]; then
            echo "GPG_PACKAGER_PASSPHRASE secret is not set. Please add it to the repository secrets."
            exit 1
          fi

      - name: Generate GitHub App Token
        id: app_token
        if: false
        run: echo "token=unused" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: '${{ github.token }}'

      - name: Import GPG key
        id: gpg_import
        uses: DCx7C5/actions/gpg-import@v1
        with:
          import-method: 'inline'
          key: ${{ secrets.GPG_PACKAGER_PRIVATE_KEY || secrets.GPG_PRIVATE_KEY }}
          gpg-pass: ${{ secrets.GPG_PACKAGER_PASSPHRASE || secrets.GPG_PASSPHRASE }}
          delete-after-import: 'true'
          configure-git: 'true'
          initialize-home: 'true'
          preset-passphrase-cache: 'true'
          gh-token: ${{ github.token }}
          gpg-type: 'private_key'

  build-aurdb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: "build-aurdb"
      cancel-in-progress: true
    steps:
      - name: Generate GitHub App Token
        id: app_token
        if: false
        run: echo "token=unused" >> "$GITHUB_OUTPUT"

      - name: Checkout AUR database repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Import GPG key
        id: gpg_import
        uses: DCx7C5/actions/gpg-import@v1
        with:
          import-method: 'inline'
          key: ${{ secrets.GPG_PACKAGER_PRIVATE_KEY || secrets.GPG_PRIVATE_KEY }}
          gpg-pass: ${{ secrets.GPG_PACKAGER_PASSPHRASE || secrets.GPG_PASSPHRASE }}
          delete-after-import: 'true'
          configure-git: 'true'
          initialize-home: 'true'
          preset-passphrase-cache: 'true'
          gh-token: ${{ github.token }}
          gpg-type: 'private_key'

      - name: Build AUR database
        id: build_aurdb
        uses: DCx7C5/actions/aur-build-repodb@v1
        with:
          database_name: ${{ secrets.AUR_DB_NAME }}
          gpg_sign: 'true'
          gpg_key_id: ${{ steps.gpg_import.outputs.fingerprint }}
          gpg_passphrase: ${{ secrets.GPG_PACKAGER_PASSPHRASE || secrets.GPG_PASSPHRASE }}
          gh-token: ${{ github.token }}
          working_directory: ${{ github.workspace }}
