name: Build Sign and Release Package

on:
  repository_dispatch:
    types:
      - pkgbuild-release-request
  workflow_dispatch:
    inputs:
      package:
        description: Package name from Dystopian-PKGBUILDs
        required: true
      version:
        description: Package version (pkgver-pkgrel)
        required: false
      channel:
        description: Release channel tag (e.g. core, extra)
        required: false
        default: core
      source_sha:
        description: Optional PKGBUILDS commit SHA
        required: false

permissions:
  contents: write
  actions: write

jobs:
  build-sign-release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve payload
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          pkg="$(jq -r '.client_payload.package // .inputs.package // empty' "$GITHUB_EVENT_PATH")"
          ver="$(jq -r '.client_payload.version // .inputs.version // empty' "$GITHUB_EVENT_PATH")"
          channel="$(jq -r '.client_payload.channel // .inputs.channel // "core"' "$GITHUB_EVENT_PATH")"
          source_sha="$(jq -r '.client_payload.source_sha // .inputs.source_sha // empty' "$GITHUB_EVENT_PATH")"

          [[ -n "$pkg" ]] || { echo "::error::package is required"; exit 1; }
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DYSTOPIANBOT_APP_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          owner: DystopianOS

      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}

      - name: Clone PKGBUILDS source repository
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/DystopianOS/Dystopian-PKGBUILDs.git" _pkgbuilds
          if [[ -n "${{ steps.payload.outputs.source_sha }}" ]]; then
            git -C _pkgbuilds checkout "${{ steps.payload.outputs.source_sha }}"
          fi
          [[ -f "_pkgbuilds/${{ steps.payload.outputs.package }}/PKGBUILD" ]] || {
            echo "::error::PKGBUILD not found for package ${{ steps.payload.outputs.package }}"
            exit 1
          }

      - name: Import GPG packager key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.gnupg"
          chmod 700 "$GITHUB_WORKSPACE/.gnupg"
          export GNUPGHOME="$GITHUB_WORKSPACE/.gnupg"
          printf '%s' "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          key_id="${{ secrets.GPG_PACKAGER_KEY_ID }}"
          if [[ -z "$key_id" ]]; then
            key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          fi
          [[ -n "$key_id" ]] || { echo "::error::No secret key available for signing"; exit 1; }
          echo "GPG_KEY_ID=$key_id" >> "$GITHUB_ENV"

      - name: Build and sign package in Arch container
        uses: DCx7C5/actions/arch-run-cmd@v1
        with:
          run-with-sudo: "true"
          enable-ccache: "true"
          gh-token: ${{ steps.app_token.outputs.token }}
          gpg-home: ${{ format('{0}/.gnupg', github.workspace) }}
          gpg-key-id: ${{ env.GPG_KEY_ID }}
          gpg-passphrase: ${{ secrets.GPG_PACKAGER_PASSPHRASE }}
          preset-passphrase-cache: "true"
          command: |
            set -euo pipefail
            cd "_pkgbuilds/${{ steps.payload.outputs.package }}"
            makepkg --syncdeps --cleanbuild --noconfirm --sign --key "${GPG_KEY_ID}"

      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir="_pkgbuilds/${{ steps.payload.outputs.package }}"
          mkdir -p release-assets
          shopt -s nullglob
          files=(
            "$pkg_dir"/*.pkg.tar.zst
            "$pkg_dir"/*.pkg.tar.zst.sig
            "$pkg_dir"/*.src.tar.gz
            "$pkg_dir"/*.src.tar.gz.sig
          )
          if (( ${#files[@]} == 0 )); then
            echo "::error::No build artifacts found in $pkg_dir"
            exit 1
          fi
          cp -f "${files[@]}" release-assets/

          version="${{ steps.payload.outputs.version }}"
          if [[ -z "$version" ]]; then
            pkgver="$(awk -F= '/^pkgver=/{print $2; exit}' "$pkg_dir/PKGBUILD")"
            pkgrel="$(awk -F= '/^pkgrel=/{print $2; exit}' "$pkg_dir/PKGBUILD")"
            version="${pkgver}-${pkgrel}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${{ steps.payload.outputs.channel }}/${{ steps.payload.outputs.package }}/${version}" >> "$GITHUB_OUTPUT"

      - name: Create channel package release
        uses: DCx7C5/actions/gh-create-release@v1
        with:
          gh-token: ${{ steps.app_token.outputs.token }}
          release-tag: ${{ steps.assets.outputs.tag }}
          release-name: ${{ steps.payload.outputs.channel }}/${{ steps.payload.outputs.package }} ${{ steps.assets.outputs.version }}
          generate-notes: "false"
          release-body: |
            Channel: `${{ steps.payload.outputs.channel }}`
            Package: `${{ steps.payload.outputs.package }}`
            Version: `${{ steps.assets.outputs.version }}`
            Source SHA: `${{ steps.payload.outputs.source_sha }}`
          assets: |
            release-assets/*.pkg.tar.zst
            release-assets/*.pkg.tar.zst.sig
            release-assets/*.src.tar.gz
            release-assets/*.src.tar.gz.sig
          fail-if-exists: "false"
