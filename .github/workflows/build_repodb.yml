name: "Build AUR Database in GitHub Repository"

on:
  workflow_dispatch:
    inputs:
      pkg_name:
        description: "Target package name that triggered the database rebuild (optional, used for logging purposes)"
        required: false
        type: string
      remote_pkg_name:
        description: "Remote package name that triggered the database rebuild (optional, used for logging purposes)"
        required: false
        type: string


jobs:
  detect-packages:
    runs-on: ubuntu-latest
    outputs:
      has_packages: ${{ steps.detect.outputs.has_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect package artifacts in x86_64
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p x86_64
          shopt -s nullglob
          pkgs=(x86_64/*.pkg.tar.zst)
          if (( ${#pkgs[@]} > 0 )); then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Found ${#pkgs[@]} package artifact(s) in x86_64."
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package artifacts in x86_64; bootstrapping keyring from PKGBUILDS."
          fi

  bootstrap-keyring:
    needs: detect-packages
    if: needs.detect-packages.outputs.has_packages != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Generate GitHub App Token
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DYSTOPIANBOT_CLIENT_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          owner: DystopianOS
          repositories: Dystopian-PKGBUILDS

      - name: Trigger PKGBUILDS keyring bootstrap
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.DYSTOPIAN_PKGBUILDS_DISPATCH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          trigger_dispatch() {
            local token="$1"
            GH_TOKEN="$token" gh api \
              -X POST \
              repos/DystopianOS/Dystopian-PKGBUILDS/actions/workflows/build_repo.yml/dispatches \
              -f ref=main \
              -f inputs[package]=dystopian-keyring \
              -f inputs[channel]=x86_64
          }

          if [[ -n "${APP_TOKEN:-}" ]]; then
            if trigger_dispatch "$APP_TOKEN"; then
              echo "::notice::Triggered Dystopian-PKGBUILDS build_repo.yml with GitHub App token."
              exit 0
            fi
            echo "::warning::GitHub App token dispatch failed; trying DYSTOPIAN_PKGBUILDS_DISPATCH_TOKEN fallback."
          fi

          if [[ -z "${FALLBACK_TOKEN:-}" ]]; then
            echo "::error::DYSTOPIAN_PKGBUILDS_DISPATCH_TOKEN is required when app-based cross-repo dispatch is denied."
            exit 1
          fi

          trigger_dispatch "$FALLBACK_TOKEN"
          echo "::notice::Triggered Dystopian-PKGBUILDS build_repo.yml with fallback token."

  build-aur-db:
    needs: detect-packages
    if: needs.detect-packages.outputs.has_packages == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: "build-aur-db"
      cancel-in-progress: true
    steps:
      - name: Generate GitHub App Token
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DYSTOPIANBOT_CLIENT_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          owner: DystopianOS

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: '${{ steps.app_token.outputs.token || github.token }}'
      - name: Build AUR database and push to repository
        id: build_aur_db
        uses: DCx7C5/actions/aur-build-repodb@v1
        with:
          database_name: ${{ secrets.AUR_DB_NAME }}
          gpg_sign: 'true'
          gpg_key_id: ${{ secrets.GPG_PACKAGER_KEY_ID }}
          gpg_passphrase: ${{ secrets.GPG_PACKAGER_PASSPHRASE }}
          gh-token: ${{ steps.app_token.outputs.token || github.token }}
          working_directory: ${{ github.workspace }}/x86_64
