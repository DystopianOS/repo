name: "Build AUR Database in GitHub Repository"

on:
  workflow_dispatch:
    inputs:
      pkg_name:
        description: "Target package name that triggered the database rebuild (optional, used for logging purposes)"
        required: false
        type: string
      remote_pkg_name:
        description: "Remote package name that triggered the database rebuild (optional, used for logging purposes)"
        required: false
        type: string


jobs:
  build-aur-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: "build-aur-db"
      cancel-in-progress: true
    steps:
      - name: Generate GitHub App Token
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DYSTOPIANBOT_CLIENT_ID }}
          private-key: ${{ secrets.DYSTOPIANBOT_KEY }}
          owner: DystopianOS

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: '${{ steps.app_token.outputs.token || github.token }}'

      - name: Detect package artifacts in x86_64
        id: detect_pkgs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p x86_64
          shopt -s nullglob
          pkgs=(x86_64/*.pkg.tar.zst)
          if (( ${#pkgs[@]} > 0 )); then
            echo "has_packages=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Found ${#pkgs[@]} package artifact(s) in x86_64."
          else
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package artifacts in x86_64; triggering PKGBUILDS keyring bootstrap."
          fi

      - name: Trigger PKGBUILDS keyring bootstrap
        if: steps.detect_pkgs.outputs.has_packages != 'true'
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -X POST \
            repos/DystopianOS/Dystopian-PKGBUILDS/actions/workflows/build_repo.yml/dispatches \
            -f ref=main \
            -f inputs[package]=dystopian-keyring \
            -f inputs[channel]=x86_64
          echo "::notice::Triggered Dystopian-PKGBUILDS build_repo.yml for dystopian-keyring on channel x86_64."

      - name: Stop after bootstrap dispatch
        if: steps.detect_pkgs.outputs.has_packages != 'true'
        shell: bash
        run: |
          echo "::notice::Repository is empty; waiting for PKGBUILDS output to publish packages under x86_64 before rebuilding repodb."
          exit 0

      - name: Build AUR database and push to repository
        if: steps.detect_pkgs.outputs.has_packages == 'true'
        id: build_aur_db
        uses: DCx7C5/actions/aur-build-repodb@v1
        with:
          database_name: ${{ secrets.AUR_DB_NAME }}
          gpg_sign: 'true'
          gpg_key_id: ${{ secrets.GPG_PACKAGER_KEY_ID }}
          gpg_passphrase: ${{ secrets.GPG_PACKAGER_PASSPHRASE }}
          gh-token: ${{ steps.app_token.outputs.token || github.token }}
          working_directory: ${{ github.workspace }}/x86_64
